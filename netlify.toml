# Déploiement de la version web sur Netlify.
# Variables à définir dans Netlify (Site settings > Environment variables) :
#   EXPO_PUBLIC_SUPABASE_URL et EXPO_PUBLIC_SUPABASE_ANON_KEY

[build]
  command = "npx expo export --platform web"
  publish = "dist"

# Toutes les adresses (ex. /recette/123) renvoient vers l'application, qui
# affiche ensuite le bon écran — évite une erreur 404 au rechargement.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
